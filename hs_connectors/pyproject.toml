[build-system]
requires = ["setuptools >= 82.0.1", "setuptools-git-versioning>=2.0,<3", "packaging"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[project]
name = "hs-connectors"
dynamic = ["version"]          # was: version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "safetensors",
    "torch",
]
